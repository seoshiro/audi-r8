name: Publish Audi R8 to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble and verify the release
        env:
          MEDIA_ORIGIN: https://audi-r8-one-form-beibars.gokuseens.chatgpt.site
        run: |
          python3 - <<'PY'
          import hashlib, os, shutil, subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          manifest = Path('pages-release.sha256').read_text().splitlines()
          def stage(line):
              expected, path = line.split(None, 1)
              source = Path(path)
              target = Path('_site') / source
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.is_file():
                  shutil.copyfile(source, target)
              elif path.startswith('./media/'):
                  subprocess.run(['curl', '-fsSL', '--retry', '3', '--max-time', '90', '-o', str(target),
                      os.environ['MEDIA_ORIGIN'] + '/' + path[2:]], check=True)
              else:
                  raise RuntimeError(f'Missing repository file: {path}')
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                  raise RuntimeError(f'Checksum mismatch: {path}')
          with ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(stage, manifest))
          print(f'Verified {len(manifest)} production files')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: publication
        uses: actions/deploy-pages@v4
